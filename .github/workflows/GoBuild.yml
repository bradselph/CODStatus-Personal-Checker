    # with name CODStatus_Personal_Checker_2.0.exe (from main.spec line 24).
    # FIX: Change path to ./dist/CODStatus_Personal_Checker_2.0.exe after fixing the build step.
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CODStatusPersonalChecker
        path: ./CODStatusPersonalChecker.exe

