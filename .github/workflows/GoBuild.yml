name: Go

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    # TODO: This build step will FAIL - no Go files exist in this Python project
    # FIX: Replace with: pip install -r requirements.txt && pyinstaller main.spec
    - name: Build
      run: go build .

    # TODO: Wrong artifact path - this file will never exist
    # WHY: The build step tries to compile Go code which doesn't exist, so CODStatusPersonalChecker.exe
